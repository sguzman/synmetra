name: Public source secret-heuristic check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-secret-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify synthetic credential signature detection and redaction
        shell: bash
        run: bash ci/test-secret-scanner.sh
      - name: Scan tracked text without printing matched secrets
        shell: bash
        run: bash ci/scan-secrets.sh
