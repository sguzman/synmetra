name: Pinned upstream schema and signature drift

on:
  push:
    paths:
      - .github/workflows/upstream-drift.yml
      - spec/upstream/drift-lock.json
      - ci/test-upstream-drift-watch.sh
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

# The watch is read-only against upstream repositories; issues are the
# explicitly permitted local maintenance artifact, never automatic repinning.
permissions:
  contents: read
  issues: write

# Serializing checks prevents simultaneous scheduled and manual runs from
# opening duplicate issues for the same reviewed source.
concurrency:
  group: synmetra-upstream-drift-${{ github.repository }}
  cancel-in-progress: false

jobs:
  source-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify real drift watch logic with offline issue fixtures
        shell: bash
        run: bash ci/test-upstream-drift-watch.sh
      - name: Detect changes in upstream signature-bearing Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed=0
          for source in sednalabs googleanalytics; do
            repository=$(jq -er --arg name "$source" '.[$name].repository' spec/upstream/drift-lock.json)
            path=$(jq -er --arg name "$source" '.[$name].path' spec/upstream/drift-lock.json)
            expected=$(jq -er --arg name "$source" '.[$name].blob_sha' spec/upstream/drift-lock.json)
            case "$repository:$path" in
              sednalabs/ga4-mcp:spec/tool_schema_snapshot.v1.json | \
              googleanalytics/google-analytics-mcp:analytics_mcp/coordinator.py) ;;
              *) echo "Unrecognized reference source: $source" >&2; exit 1 ;;
            esac
            current=$(curl --fail --silent --show-error --retry 2 --max-time 25 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$repository/contents/$path?ref=main" \
              | jq -er '.sha')
            if [[ "$current" != "$expected" ]]; then
              echo "Upstream $source signature-source blob changed: pinned $expected, current $current" >&2
              echo "Review $repository/$path for name, argument, or behavior changes; do not silently repin." >> "$GITHUB_STEP_SUMMARY"

              # Keep one OPEN maintenance issue per upstream source. No copied
              # sources, automatic repinning, new parity credit, or issue spam.
              title="[upstream-drift] Review $source signature source"
              open_count="$(gh api --paginate \
                "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
                | jq -s --arg title "$title" \
                  '[.[][] | select(.pull_request == null and .title == $title)] | length')"
              if test "$open_count" -eq 0; then
                body="$(printf '%s\n' \
                  'Automated upstream signature-source drift warning (not proof of a breaking change).' \
                  '' \
                  "Source: https://github.com/$repository/blob/main/$path" \
                  "Reviewed/pinned Git blob: $expected" \
                  "Observed current Git blob: $current" \
                  '' \
                  'Review tool names, parameters, defaults, errors and response schemas against the frozen pinned baselines. Update the source pin, fixtures, parity ledger and tests only through a reviewed commit; do not claim parity from this automated signal.' \
                  '' \
                  "Detection: https://github.com/$GITHUB_REPOSITORY/actions/workflows/upstream-drift.yml")"
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
                echo "Opened maintenance issue: $title" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Existing open maintenance issue: $title" >> "$GITHUB_STEP_SUMMARY"
              fi
              changed=1
            else
              echo "✅ $source signature-source blob unchanged" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$changed"
