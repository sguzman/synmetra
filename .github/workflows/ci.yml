name: Rust native MCP and evidence integrity

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    concurrency:
      group: synmetra-core-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust 1.99.1 with rustfmt and Clippy
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustc --version | grep -F 'rustc 1.99.1'
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Verify pinned schema fixture Git object hashes
        shell: bash
        run: |
          count=0
          while read -r file expected; do
            if test -z "$file"; then continue; fi
            if test "$(printf '%s' "$file" | cut -c1)" = "#"; then continue; fi
            test -f "$file" || { echo "Missing pinned contract: $file" >&2; exit 1; }
            actual="$(git hash-object "$file")"
            if test "$actual" != "$expected"; then
              echo "Pinned contract drift: $file" >&2
              exit 1
            fi
            count=$((count + 1))
          done < spec/upstream/schema-lock.tsv
          test "$count" -eq 4 || { echo "Wrong pinned fixture count" >&2; exit 1; }
      - name: Check pinned 36-tool live eligibility matrix
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.union.tools[].name' docs/tool-inventory.json | LC_ALL=C sort > "$RUNNER_TEMP/union-names"
          awk -F '|' '/^[|] `[^`]+` [|]/ { gsub(/[ `]/, "", $2); print $2 }' docs/LIVE_ACCEPTANCE_MATRIX.md |
            LC_ALL=C sort > "$RUNNER_TEMP/eligibility-names"
          test "$(wc -l < "$RUNNER_TEMP/eligibility-names")" -eq 36
          diff -u "$RUNNER_TEMP/union-names" "$RUNNER_TEMP/eligibility-names"
          grep -Fq 'No live Google Analytics OAuth/property/role QA has been accepted' docs/LIVE_ACCEPTANCE_MATRIX.md

      - name: Validate changelog version and evidence-gated release policy
        shell: bash
        run: |
          set -euo pipefail
          test -f CHANGELOG.md
          test -f docs/RELEASE_POLICY.md
          test -f docs/INSTALL.md
          test -f .github/workflows/linux-release.yml
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)"
          grep -Fq "## [$version]" CHANGELOG.md
          grep -Fq 'Rust 1.99.1' docs/RELEASE_POLICY.md
          grep -Fq 'No production parity release is authorized' docs/RELEASE_POLICY.md
          grep -Fq 'independent' docs/RELEASE_POLICY.md
          grep -Fq '36-tool' docs/RELEASE_POLICY.md

      - name: Check pinned local Arch packaging recipe
        shell: bash
        run: |
          bash -n packaging/arch/PKGBUILD
          (
            source packaging/arch/PKGBUILD
            test "$pkgname" = synmetra
            test "$pkgver" = 0.0.1
            test "$_commit" = d6ce2322d6f073d59844ea3d07e4d1a0c0886b54
            [[ "$source" == *"#commit=$_commit" ]]
            test "$sha256sums" = SKIP
            declare -f build | grep -Fq -- '--frozen --release --bin synmetra'
            declare -f package | grep -Fq -- 'install -Dm755'
          )

      - name: Verify committed canonical formatting
        run: cargo fmt --all -- --check
      - name: Run default Rust MCP tests
        run: cargo test --all-targets --locked
      - name: Strict Clippy on default features
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Verify native rustls and no Python/OpenSSL runtime boundary
        shell: bash
        run: |
          cargo tree --locked --edges normal,build --prefix none > "$RUNNER_TEMP/synmetra-dependencies.txt"
          if grep -Eiq '^(openssl|openssl-sys|native-tls|tokio-native-tls|pyo3|pyo3-ffi|python3-sys)( |$)' "$RUNNER_TEMP/synmetra-dependencies.txt"; then
            echo "Unexpected TLS or Python dependency in native Rust graph" >&2
            exit 1
          fi
          cargo build --locked --bin synmetra
          if ldd target/debug/synmetra | grep -Eiq 'lib(ssl|crypto|python)'; then
            echo "Unexpected OpenSSL or Python dynamic runtime linkage" >&2
            exit 1
          fi
      - name: Verify real stdio negotiation, tool discovery, calls, and clean stdout
        shell: bash
        run: |
          initialize='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"synmetra-ci","version":"1"}}}'
          initialized='{"jsonrpc":"2.0","method":"notifications/initialized"}'
          discovery='{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          call='{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"ga4_get_started","arguments":{}}}'
          canary='synmetra-ci-private-canary-572'
          printf '%s\n' "$initialize" "$initialized" "$discovery" "$call" | \
            SYNMETRA_GOOGLE_ACCESS_TOKEN="$canary" timeout 10s target/debug/synmetra serve \
            > "$RUNNER_TEMP/synmetra-stdio.jsonl" \
            2> "$RUNNER_TEMP/synmetra-stdio.stderr"
          test -s "$RUNNER_TEMP/synmetra-stdio.jsonl"
          jq --slurp --exit-status '
            length == 3
            and all(.[]; .jsonrpc == "2.0" and .error == null)
            and any(.[]; .id == 1
              and (.result.protocolVersion | type == "string")
              and (.result.serverInfo.name | type == "string"))
            and any(.[]; .id == 2
              and (.result.tools | length == 20)
              and (.result.tools | any(.name == "ga4_get_started"))
              and (.result.tools | all(.inputSchema.type == "object"))
              and (.result.tools | all(.name != "create_property_annotation")))
            and any(.[]; .id == 3
              and .result.isError == false
              and (.result.structuredContent.ok == true)
              and (.result.structuredContent.data.scope == "https://www.googleapis.com/auth/analytics.readonly"))
          ' "$RUNNER_TEMP/synmetra-stdio.jsonl" > /dev/null
          if grep -Fq "$canary" "$RUNNER_TEMP/synmetra-stdio.jsonl"; then
            echo "Unexpected credential material in MCP stdout" >&2
            exit 1
          fi
      - name: Reject unbounded unterminated stdio input frames
        shell: bash
        run: |
          # The underlying rmcp stdio reader can otherwise buffer a line
          # indefinitely. Exercise Synmetra's bounded relay with no newline.
          if head -c 1050000 /dev/zero | tr '\0' x | \
             timeout 10s target/debug/synmetra serve \
               > "$RUNNER_TEMP/synmetra-oversize-stdio.stdout" \
               2> "$RUNNER_TEMP/synmetra-oversize-stdio.stderr"; then
            echo 'Oversized stdio input unexpectedly succeeded' >&2
            exit 1
          fi
          grep -Fq 'Rejected oversized MCP stdio frame' \
            "$RUNNER_TEMP/synmetra-oversize-stdio.stderr"
          test ! -s "$RUNNER_TEMP/synmetra-oversize-stdio.stdout"

      - name: Verify security disclosure policy without public secret reporting
        shell: bash
        run: |
          set -euo pipefail
          test -f SECURITY.md
          grep -Fq 'Reporting a vulnerability privately' SECURITY.md
          grep -Fq 'Report a vulnerability' SECURITY.md
          grep -Fq 'Do not' SECURITY.md
          grep -Fq 'has not been independently verified' SECURITY.md
          grep -Fq 'docs/LOCAL_EXECUTION_THREAT_MODEL.md' SECURITY.md

      - name: Verify canonical pinned union and explicit raw schema drift
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/CANONICAL_CONTRACT_DECISION.md
          test -f spec/audits/native-upstream-diff.v1.json
          jq -e '
            .schema == "synmetra_native_upstream_schema_diff"
            and .summary.native_tools == 36
            and .summary.sednalabs_tools == 35
            and .summary.official_google_tools == 10
            and .summary.missing_sednalabs_top_level_fields == 0
            and .summary.missing_official_google_parameter_names == 0
            and .summary.required_set_mismatches == 0
            and .summary.raw_field_shape_differences == (.raw_field_differences | length)
          ' spec/audits/native-upstream-diff.v1.json > /dev/null
          grep -Fq 'second T164 acceptance gate and T165 remain open' docs/CANONICAL_CONTRACT_DECISION.md
          grep -Fq 'One-page GA ingestion' docs/CANONICAL_CONTRACT_DECISION.md || \
            grep -Fq 'one page' docs/CANONICAL_CONTRACT_DECISION.md

      - name: Validate 36 documented native tools and JSON examples
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/NATIVE_TOOL_GUIDE.md
          test -f spec/native/tool-schema.v1.json
          jq -e '.schema == "synmetra_native_mcp_input_schema" and (.tools | length) == 36' spec/native/tool-schema.v1.json > /dev/null
          jq -r '.tools[].name' spec/native/tool-schema.v1.json | LC_ALL=C sort > "$RUNNER_TEMP/native-schema-names"
          jq -r '.union.tools[].name' docs/tool-inventory.json | LC_ALL=C sort > "$RUNNER_TEMP/inventory-names"
          sed -n 's/^### .\(.*\).$/\1/p' docs/NATIVE_TOOL_GUIDE.md | LC_ALL=C sort > "$RUNNER_TEMP/native-guide-names"
          diff -u "$RUNNER_TEMP/inventory-names" "$RUNNER_TEMP/native-schema-names"
          diff -u "$RUNNER_TEMP/inventory-names" "$RUNNER_TEMP/native-guide-names"
          test "$(grep -c '^```json$' docs/NATIVE_TOOL_GUIDE.md)" -eq 36
          awk '/^```json$/ {block=1; next} block && /^```$/ {block=0; print ""; next} block {print}' docs/NATIVE_TOOL_GUIDE.md | jq -s -e 'length == 36' > /dev/null
          awk '/^### / {name=$2; gsub(/[^[:alnum:]_]/, "", name)} /^```json$/ {body=1; json=""; next} body && /^```$/ {print name "\t" json; body=0; next} body {json=json $0}' docs/NATIVE_TOOL_GUIDE.md > "$RUNNER_TEMP/native-guide-fixtures"
          test "$(wc -l < "$RUNNER_TEMP/native-guide-fixtures")" -eq 36
          while IFS=$'\t' read -r name example; do
            jq -e --arg name "$name" --argjson args "$example" '.tools[] | select(.name == $name) | all((.inputSchema.required // [])[]; . as $key | $args | has($key))' spec/native/tool-schema.v1.json > /dev/null
          done < "$RUNNER_TEMP/native-guide-fixtures"

      - name: Check native Codex and upstream migration instructions
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/CODEX.md
          test -f docs/MCP_CLIENTS.md
          test -f docs/MIGRATION.md
          grep -Fq 'codex mcp add synmetra -- ~/.local/bin/synmetra serve' docs/CODEX.md
          grep -Fq 'codex mcp remove synmetra' docs/CODEX.md
          grep -Fq 'one trusted local user' docs/MCP_CLIENTS.md
          grep -Fq '0 SednaLabs inputs missing from the reviewed native schema' docs/MIGRATION.md
          grep -Fq '0.0.1' Cargo.toml
          grep -Fq 'docs/CODEX.md' README.md
          grep -Fq 'docs/MIGRATION.md' README.md

      - name: Verify native operator reference and redacted smoke documentation
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/CLI.md
          test -f docs/GOOGLE_CLOUD.md
          test -f docs/SMOKE_SCENARIOS.md
          for name in --http-loopback --allow-write --scratchpad --allow-edit --headless --callback-port --client-id-file; do
            grep -Fq -- "$name" docs/CLI.md
          done
          for name in SYNMETRA_GOOGLE_ACCESS_TOKEN SYNMETRA_MCP_BEARER_TOKEN SYNMETRA_MCP_PORT XDG_CONFIG_HOME; do
            grep -Fq -- "$name" docs/CLI.md
          done
          grep -Fq 'read -s -P' docs/CLI.md
          grep -Fq 'fish_add_path' docs/INSTALL.md
          grep -Fq 'Google Analytics Admin API' docs/GOOGLE_CLOUD.md
          grep -Fq 'Google Analytics Data API' docs/GOOGLE_CLOUD.md
          grep -Fq 'https://www.googleapis.com/auth/analytics.readonly' docs/GOOGLE_CLOUD.md
          grep -Fq 'https://www.googleapis.com/auth/analytics.edit' docs/GOOGLE_CLOUD.md
          grep -Fq 'No manual user QA' docs/SMOKE_SCENARIOS.md || grep -Fq 'No manual user QA' docs/INSTALL.md
          grep -Fq 'live_GA=false' docs/SMOKE_SCENARIOS.md
          grep -Fq 'credential' docs/SMOKE_SCENARIOS.md
          grep -Fq 'docs/GOOGLE_CLOUD.md' README.md
          grep -Fq 'docs/SMOKE_SCENARIOS.md' README.md
          grep -Fq 'does **not** require installing or running' docs/GOOGLE_CLOUD.md
          grep -Fq 'No Python, npm, Node, gcloud' docs/CLI.md

      - name: Parse Fish examples using native Fish shell
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fish
          snippets="$RUNNER_TEMP/synmetra-fish-snippets"
          mkdir -p "$snippets"
          awk -v dir="$snippets" '
            /^```fish$/ {inside=1; n++; file=sprintf("%s/example-%02d.fish", dir, n); next}
            inside && /^```$/ {inside=0; close(file); next}
            inside {print > file}
          ' docs/INSTALL.md docs/CLI.md
          test "$(find "$snippets" -name "*.fish" -type f | wc -l)" -eq 5
          while IFS= read -r script; do
            fish -n "$script"
          done < <(find "$snippets" -name "*.fish" -type f | LC_ALL=C sort)
          fish -c 'set -gx SYNMETRA_TEST_FISH_CANARY local-only; test "$SYNMETRA_TEST_FISH_CANARY" = local-only'
          grep -Fq 'read -s -P' "$snippets/example-05.fish"

      - name: Verify offline CLI help across native invocation modes
        shell: bash
        run: |
          env -i PATH=/nonexistent target/debug/synmetra --help \
            > "$RUNNER_TEMP/synmetra-help.txt"
          env -i PATH=/nonexistent target/debug/synmetra serve --help \
            > "$RUNNER_TEMP/synmetra-serve-help.txt"
          env -i PATH=/nonexistent target/debug/synmetra auth --help \
            > "$RUNNER_TEMP/synmetra-auth-help.txt"
          env -i PATH=/nonexistent target/debug/synmetra auth login --help \
            > "$RUNNER_TEMP/synmetra-auth-login-help.txt"
          cmp "$RUNNER_TEMP/synmetra-help.txt" "$RUNNER_TEMP/synmetra-serve-help.txt"
          cmp "$RUNNER_TEMP/synmetra-auth-help.txt" "$RUNNER_TEMP/synmetra-auth-login-help.txt"
          grep -Fq 'read-only stdio' "$RUNNER_TEMP/synmetra-help.txt"
          grep -Fq -- '--scratchpad' "$RUNNER_TEMP/synmetra-help.txt"
          grep -Fq 'SYNMETRA_MCP_BEARER_TOKEN' "$RUNNER_TEMP/synmetra-help.txt"
          grep -Fq -- '--allow-edit' "$RUNNER_TEMP/synmetra-auth-help.txt"
          grep -Fq 'Google Cloud Desktop OAuth client JSON' "$RUNNER_TEMP/synmetra-auth-help.txt"
          env -i PATH=/nonexistent target/debug/synmetra --version \
            > "$RUNNER_TEMP/synmetra-offline-version.txt"
          grep -Fq 'synmetra 0.0.1' "$RUNNER_TEMP/synmetra-offline-version.txt"

      - name: Verify native auth doctor and credential-safe CLI failures
        shell: bash
        run: |
          config_root="$(mktemp -d "$RUNNER_TEMP/synmetra-auth-smoke.XXXXXX")"
          trap 'rm -rf "$config_root"' EXIT
          XDG_CONFIG_HOME="$config_root" target/debug/synmetra auth doctor \
            > "$RUNNER_TEMP/synmetra-doctor-setup.txt"
          grep -Fq 'To configure native OAuth:' "$RUNNER_TEMP/synmetra-doctor-setup.txt"
          grep -Fq 'Google Analytics Admin and Data APIs must be enabled' "$RUNNER_TEMP/synmetra-doctor-setup.txt"

          canary='synmetra-doctor-ci-private-canary-903'
          SYNMETRA_GOOGLE_ACCESS_TOKEN="$canary" XDG_CONFIG_HOME="$config_root" \
            target/debug/synmetra auth doctor \
            > "$RUNNER_TEMP/synmetra-doctor-token.txt"
          grep -Fq '"override_token_present": true' "$RUNNER_TEMP/synmetra-doctor-token.txt"
          if grep -Fq "$canary" "$RUNNER_TEMP/synmetra-doctor-token.txt"; then
            echo 'Doctor exposed the synthetic access token' >&2
            exit 1
          fi

          XDG_CONFIG_HOME="$config_root" target/debug/synmetra auth status \
            > "$RUNNER_TEMP/synmetra-auth-status.txt"
          grep -Fq 'no saved OAuth credentials' "$RUNNER_TEMP/synmetra-auth-status.txt"
          XDG_CONFIG_HOME="$config_root" target/debug/synmetra auth command \
            > "$RUNNER_TEMP/synmetra-auth-command.txt"
          grep -Fq 'synmetra auth login --client-id-file' "$RUNNER_TEMP/synmetra-auth-command.txt"

          # Verify native operator diagnostics work without any gcloud, Python,
          # npm, external shell utilities or executable PATH in the child process.
          env -i PATH=/nonexistent XDG_CONFIG_HOME="$config_root" \
            target/debug/synmetra auth doctor \
            > "$RUNNER_TEMP/synmetra-doctor-isolated.txt"
          grep -Fq 'To configure native OAuth:' "$RUNNER_TEMP/synmetra-doctor-isolated.txt"
          env -i PATH=/nonexistent XDG_CONFIG_HOME="$config_root" \
            target/debug/synmetra auth status \
            > "$RUNNER_TEMP/synmetra-status-isolated.txt"
          grep -Fq 'no saved OAuth credentials' "$RUNNER_TEMP/synmetra-status-isolated.txt"
          env -i PATH=/nonexistent XDG_CONFIG_HOME="$config_root" \
            target/debug/synmetra auth command \
            > "$RUNNER_TEMP/synmetra-command-isolated.txt"
          grep -Fq 'synmetra auth login --client-id-file' "$RUNNER_TEMP/synmetra-command-isolated.txt"

          # Enter the native login implementation (not merely its usage parser)
          # with no executable PATH. An unreadable Desktop client must fail
          # locally and must not invoke gcloud, Python, npm or a browser.
          if env -i PATH=/nonexistent XDG_CONFIG_HOME="$config_root" \
            target/debug/synmetra auth login --headless \
              --client-id-file "$config_root/missing-desktop-client.json" \
            > "$RUNNER_TEMP/synmetra-login-isolated.stdout" \
            2> "$RUNNER_TEMP/synmetra-login-isolated.stderr"; then
            echo "Invalid isolated OAuth client unexpectedly succeeded" >&2
            exit 1
          fi
          grep -Fq 'Cannot read Google OAuth Desktop client JSON' \
            "$RUNNER_TEMP/synmetra-login-isolated.stderr"
          test ! -s "$RUNNER_TEMP/synmetra-login-isolated.stdout"

          env -i PATH=/nonexistent XDG_CONFIG_HOME="$config_root" \
            target/debug/synmetra auth logout \
            > "$RUNNER_TEMP/synmetra-logout-isolated.txt"
          grep -Fq 'Synmetra local credentials cleared' \
            "$RUNNER_TEMP/synmetra-logout-isolated.txt"

          if XDG_CONFIG_HOME="$config_root" target/debug/synmetra auth login --headless \
            > "$RUNNER_TEMP/synmetra-auth-bad.stdout" \
            2> "$RUNNER_TEMP/synmetra-auth-bad.stderr"; then
            echo 'Login without OAuth client unexpectedly succeeded' >&2
            exit 1
          fi
          grep -Fq 'OAuth login requires --client-id-file' "$RUNNER_TEMP/synmetra-auth-bad.stderr"
          test ! -s "$RUNNER_TEMP/synmetra-auth-bad.stdout"
          XDG_CONFIG_HOME="$config_root" target/debug/synmetra auth logout \
            > "$RUNNER_TEMP/synmetra-logout.txt"
          grep -Fq 'Revoke access in your Google account' "$RUNNER_TEMP/synmetra-logout.txt"

      - name: Verify isolated Cargo source install and native CLI lifecycle
        shell: bash
        run: |
          root="$RUNNER_TEMP/synmetra-installed"
          mkdir -p "$root"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            cargo +1.99.1 install --path . --locked --debug --bin synmetra --root "$root"
          test -x "$root/bin/synmetra"
          test ! -e "$root/bin/synmetra-progress"
          config_root="$(mktemp -d "$RUNNER_TEMP/synmetra-install-smoke.XXXXXX")"
          trap 'rm -rf "$config_root"' EXIT
          env -i PATH=/nonexistent XDG_CONFIG_HOME="$config_root" \
            "$root/bin/synmetra" auth doctor > "$RUNNER_TEMP/synmetra-installed-doctor.txt"
          grep -Fq 'To configure native OAuth:' "$RUNNER_TEMP/synmetra-installed-doctor.txt"
          if grep -Eiq 'refresh_token|client_secret|access_token": "' \
            "$RUNNER_TEMP/synmetra-installed-doctor.txt"; then
            echo 'Sensitive credential value in native install smoke' >&2
            exit 1
          fi
          cargo +1.99.1 uninstall --root "$root" synmetra
          test ! -e "$root/bin/synmetra"

      - name: Reject unsupported public MCP bind overrides before network startup
        shell: bash
        run: |
          if target/debug/synmetra serve --http-loopback --host 0.0.0.0 \
            > "$RUNNER_TEMP/synmetra-nonloopback.stdout" \
            2> "$RUNNER_TEMP/synmetra-nonloopback.stderr"; then
            echo "Unsupported public bind override unexpectedly succeeded" >&2
            exit 1
          fi
          grep -Fq 'Usage: synmetra serve' "$RUNNER_TEMP/synmetra-nonloopback.stderr"
          test ! -s "$RUNNER_TEMP/synmetra-nonloopback.stdout"

      - name: Smoke test official pinned Codex MCP global registration
        shell: bash
        run: |
          set -euo pipefail
          # Native official Rust Codex release, not an npm or Node wrapper.
          tag='rust-v0.164.0'
          asset='codex-x86_64-unknown-linux-musl.tar.gz'
          digest='90dd0b03b28afcb7fa733a4f73b413db2916a47347efd43fb669cc1c774ee8e4'
          tmp="$(mktemp -d "$RUNNER_TEMP/synmetra-codex.XXXXXX")"
          export CODEX_HOME="$tmp/home"
          mkdir -m 700 "$CODEX_HOME" "$tmp/bin"
          curl -fLsS --retry 2 --max-time 180 \
            "https://github.com/openai/codex/releases/download/$tag/$asset" \
            -o "$tmp/$asset"
          printf '%s  %s\n' "$digest" "$tmp/$asset" | sha256sum -c -
          tar -xzf "$tmp/$asset" -C "$tmp/bin"
          codex="$(find "$tmp/bin" -maxdepth 2 -type f -name 'codex*' -print -quit)"
          test -n "$codex"
          chmod 700 "$codex"
          "$codex" --version > "$RUNNER_TEMP/synmetra-codex-version.txt"
          grep -Eq 'codex|Codex' "$RUNNER_TEMP/synmetra-codex-version.txt"
          "$codex" mcp add synmetra -- "$GITHUB_WORKSPACE/target/debug/synmetra" serve
          "$codex" mcp get synmetra --json > "$RUNNER_TEMP/synmetra-codex-get.json"
          jq -e --arg command "$GITHUB_WORKSPACE/target/debug/synmetra" \
            '.name == "synmetra" and .enabled == true
             and .transport.type == "stdio"
             and .transport.command == $command
             and .transport.args == ["serve"]
             and .transport.env == null' "$RUNNER_TEMP/synmetra-codex-get.json" > /dev/null
          "$codex" mcp list --json > "$RUNNER_TEMP/synmetra-codex-list.json"
          jq -e 'any(.[]; .name == "synmetra")' "$RUNNER_TEMP/synmetra-codex-list.json" > /dev/null
          "$codex" mcp remove synmetra
          "$codex" mcp list --json > "$RUNNER_TEMP/synmetra-codex-empty.json"
          jq -e 'length == 0' "$RUNNER_TEMP/synmetra-codex-empty.json" > /dev/null
          # No private credentials or account state are needed for configuration QA.
          test ! -e "$CODEX_HOME/auth.json"

      - name: Measure synthetic native process startup and MCP RSS
        shell: bash
        run: |
          set -euo pipefail
          bash ci/benchmark-native.sh target/debug/synmetra \
            | tee "$RUNNER_TEMP/synmetra-benchmark.json"
          jq -e '.measurements | length == 11
            and any(.[]; .profile == "fresh_help" and .max_rss_kib > 0)
            and any(.[]; .profile == "fresh_mcp_roundtrip" and .max_rss_kib > 0)
            and any(.[]; .profile == "same_process_repeated_calls" and .calls == 5)
            and all(.[]; .wall_ms > 0)
          ' "$RUNNER_TEMP/synmetra-benchmark.json" > /dev/null

      - name: Verify progress ledger and pinned contracts
        run: cargo run --locked --bin synmetra-progress
      - name: Verify README and roadmap bars regenerate reproducibly
        run: |
          cargo run --locked --bin synmetra-progress -- --write-bars
          git diff --exit-code -- README.md docs/ROADMAP.md

  duckdb:
    concurrency:
      group: synmetra-duckdb-${{ github.ref }}
      # Preserve a running expensive native DuckDB build across docs and
      # roadmap pushes. GitHub coalesces obsolete pending builds.
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install pinned Rust 1.99.1 with rustfmt and Clippy
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustc --version | grep -F 'rustc 1.99.1'
          cargo --version
      - uses: Swatinem/rust-cache@v2
      # New commits receive their own feature test after the prior run
      # completes; source snapshots are compared against the actual head.
      - name: Test bounded DuckDB scratchpad
        env:
          SYNMETRA_CAPTURE_INPUT_SCHEMAS: "1"
        run: cargo test --all-targets --locked --features scratchpad -- --nocapture
      - name: Release-gate strict Clippy with DuckDB
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo clippy --all-targets --locked --features scratchpad -- -D warnings
