name: Rust native MCP and evidence integrity

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Prevent several simultaneous bundled-DuckDB C++ builds competing for runner quotas.
concurrency:
  group: synmetra-${{ github.workflow }}-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, 'docs:') && 'docs' || 'code' }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate canonical scratchpad source and lock snapshot
        run: |
          cargo fmt --all
          cargo generate-lockfile
          for file in src/main.rs src/scratchpad.rs Cargo.lock; do
            echo "SYNMETRA_FILE_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "SYNMETRA_FILE_END:$file"
          done
      - name: Test standard Rust MCP
        run: cargo test --all-targets --locked
      - name: Determine if a native feature build is needed
        id: native
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(src/|Cargo\.toml$|Cargo\.lock$|\.github/workflows/ci\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Test feature-gated native DuckDB scratchpad
        if: steps.native.outputs.changed == 'true' || startsWith(github.ref, 'refs/tags/v')
        run: cargo test --all-targets --locked --features scratchpad
      - name: Strict Clippy for default Rust MCP
        run: cargo clippy --all-targets --locked -- -D warnings
      # Feature tests run on every native change. Bundled C++ plus a second
      # Clippy build exceeds routine runner budgets, so strict feature lint is
      # a mandatory release-tag gate in addition to default-feature Clippy.
      - name: Strict Clippy with DuckDB feature (release gate)
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo clippy --all-targets --locked --features scratchpad -- -D warnings
      - name: Verify task evidence and pinned MCP union
        run: cargo run --locked --bin synmetra-progress
