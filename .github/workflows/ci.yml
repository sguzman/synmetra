name: Rust foundation and progress integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust project
        run: cargo test --all-targets --locked
      - name: Verify committed Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy strictly
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Verify task evidence and pinned MCP union
        run: cargo run --locked --bin synmetra-progress
