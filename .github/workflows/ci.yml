name: Rust native MCP and evidence integrity

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    concurrency:
      group: synmetra-core-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust 1.99.1 with rustfmt and Clippy
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustc --version | grep -F 'rustc 1.99.1'
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Verify pinned schema fixture Git object hashes
        shell: bash
        run: |
          count=0
          while read -r file expected; do
            if test -z "$file"; then continue; fi
            if test "$(printf '%s' "$file" | cut -c1)" = "#"; then continue; fi
            test -f "$file" || { echo "Missing pinned contract: $file" >&2; exit 1; }
            actual="$(git hash-object "$file")"
            if test "$actual" != "$expected"; then
              echo "Pinned contract drift: $file" >&2
              exit 1
            fi
            count=$((count + 1))
          done < spec/upstream/schema-lock.tsv
          test "$count" -eq 4 || { echo "Wrong pinned fixture count" >&2; exit 1; }
      - name: Verify committed canonical formatting
        run: cargo fmt --all -- --check
      - name: Run default Rust MCP tests
        run: cargo test --all-targets --locked
      - name: Strict Clippy on default features
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Verify native rustls and no Python/OpenSSL runtime boundary
        shell: bash
        run: |
          cargo tree --locked --edges normal,build --prefix none > "$RUNNER_TEMP/synmetra-dependencies.txt"
          if grep -Eiq '^(openssl|openssl-sys|native-tls|tokio-native-tls|pyo3|pyo3-ffi|python3-sys)( |$)' "$RUNNER_TEMP/synmetra-dependencies.txt"; then
            echo "Unexpected TLS or Python dependency in native Rust graph" >&2
            exit 1
          fi
          cargo build --locked --bin synmetra
          if ldd target/debug/synmetra | grep -Eiq 'lib(ssl|crypto|python)'; then
            echo "Unexpected OpenSSL or Python dynamic runtime linkage" >&2
            exit 1
          fi
      - name: Verify real stdio negotiation, tool discovery, calls, and clean stdout
        shell: bash
        run: |
          initialize='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"synmetra-ci","version":"1"}}}'
          initialized='{"jsonrpc":"2.0","method":"notifications/initialized"}'
          discovery='{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          call='{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"ga4_get_started","arguments":{}}}'
          canary='synmetra-ci-private-canary-572'
          printf '%s\n' "$initialize" "$initialized" "$discovery" "$call" | \
            SYNMETRA_GOOGLE_ACCESS_TOKEN="$canary" timeout 10s target/debug/synmetra serve \
            > "$RUNNER_TEMP/synmetra-stdio.jsonl" \
            2> "$RUNNER_TEMP/synmetra-stdio.stderr"
          test -s "$RUNNER_TEMP/synmetra-stdio.jsonl"
          jq --slurp --exit-status '
            length == 3
            and all(.[]; .jsonrpc == "2.0" and .error == null)
            and any(.[]; .id == 1
              and (.result.protocolVersion | type == "string")
              and (.result.serverInfo.name | type == "string"))
            and any(.[]; .id == 2
              and (.result.tools | length == 20)
              and (.result.tools | any(.name == "ga4_get_started"))
              and (.result.tools | all(.inputSchema.type == "object"))
              and (.result.tools | all(.name != "create_property_annotation")))
            and any(.[]; .id == 3
              and .result.isError == false
              and (.result.structuredContent.ok == true)
              and (.result.structuredContent.data.scope == "https://www.googleapis.com/auth/analytics.readonly"))
          ' "$RUNNER_TEMP/synmetra-stdio.jsonl" > /dev/null
          if grep -Fq "$canary" "$RUNNER_TEMP/synmetra-stdio.jsonl"; then
            echo "Unexpected credential material in MCP stdout" >&2
            exit 1
          fi
      - name: Reject unbounded unterminated stdio input frames
        shell: bash
        run: |
          # The underlying rmcp stdio reader can otherwise buffer a line
          # indefinitely. Exercise Synmetra's bounded relay with no newline.
          if head -c 1050000 /dev/zero | tr '\0' x | \
             timeout 10s target/debug/synmetra serve \
               > "$RUNNER_TEMP/synmetra-oversize-stdio.stdout" \
               2> "$RUNNER_TEMP/synmetra-oversize-stdio.stderr"; then
            echo 'Oversized stdio input unexpectedly succeeded' >&2
            exit 1
          fi
          grep -Fq 'Rejected oversized MCP stdio frame' \
            "$RUNNER_TEMP/synmetra-oversize-stdio.stderr"
          test ! -s "$RUNNER_TEMP/synmetra-oversize-stdio.stdout"

      - name: Verify native auth doctor and credential-safe CLI failures
        shell: bash
        run: |
          config_root="$(mktemp -d "$RUNNER_TEMP/synmetra-auth-smoke.XXXXXX")"
          trap 'rm -rf "$config_root"' EXIT
          XDG_CONFIG_HOME="$config_root" target/debug/synmetra auth doctor \
            > "$RUNNER_TEMP/synmetra-doctor-setup.txt"
          grep -Fq 'To configure native OAuth:' "$RUNNER_TEMP/synmetra-doctor-setup.txt"
          grep -Fq 'Google Analytics Admin and Data APIs must be enabled' "$RUNNER_TEMP/synmetra-doctor-setup.txt"

          canary='synmetra-doctor-ci-private-canary-903'
          SYNMETRA_GOOGLE_ACCESS_TOKEN="$canary" XDG_CONFIG_HOME="$config_root" \
            target/debug/synmetra auth doctor \
            > "$RUNNER_TEMP/synmetra-doctor-token.txt"
          grep -Fq '"override_token_present": true' "$RUNNER_TEMP/synmetra-doctor-token.txt"
          if grep -Fq "$canary" "$RUNNER_TEMP/synmetra-doctor-token.txt"; then
            echo 'Doctor exposed the synthetic access token' >&2
            exit 1
          fi

          XDG_CONFIG_HOME="$config_root" target/debug/synmetra auth status \
            > "$RUNNER_TEMP/synmetra-auth-status.txt"
          grep -Fq 'no saved OAuth credentials' "$RUNNER_TEMP/synmetra-auth-status.txt"
          XDG_CONFIG_HOME="$config_root" target/debug/synmetra auth command \
            > "$RUNNER_TEMP/synmetra-auth-command.txt"
          grep -Fq 'synmetra auth login --client-id-file' "$RUNNER_TEMP/synmetra-auth-command.txt"

          # Verify native operator diagnostics work without any gcloud, Python,
          # npm, external shell utilities or executable PATH in the child process.
          env -i PATH=/nonexistent XDG_CONFIG_HOME="$config_root" \
            target/debug/synmetra auth doctor \
            > "$RUNNER_TEMP/synmetra-doctor-isolated.txt"
          grep -Fq 'To configure native OAuth:' "$RUNNER_TEMP/synmetra-doctor-isolated.txt"
          env -i PATH=/nonexistent XDG_CONFIG_HOME="$config_root" \
            target/debug/synmetra auth status \
            > "$RUNNER_TEMP/synmetra-status-isolated.txt"
          grep -Fq 'no saved OAuth credentials' "$RUNNER_TEMP/synmetra-status-isolated.txt"
          env -i PATH=/nonexistent XDG_CONFIG_HOME="$config_root" \
            target/debug/synmetra auth command \
            > "$RUNNER_TEMP/synmetra-command-isolated.txt"
          grep -Fq 'synmetra auth login --client-id-file' "$RUNNER_TEMP/synmetra-command-isolated.txt"

          # Enter the native login implementation (not merely its usage parser)
          # with no executable PATH. An unreadable Desktop client must fail
          # locally and must not invoke gcloud, Python, npm or a browser.
          if env -i PATH=/nonexistent XDG_CONFIG_HOME="$config_root" \
            target/debug/synmetra auth login --headless \
              --client-id-file "$config_root/missing-desktop-client.json" \
            > "$RUNNER_TEMP/synmetra-login-isolated.stdout" \
            2> "$RUNNER_TEMP/synmetra-login-isolated.stderr"; then
            echo "Invalid isolated OAuth client unexpectedly succeeded" >&2
            exit 1
          fi
          grep -Fq 'Cannot read Google OAuth Desktop client JSON' \
            "$RUNNER_TEMP/synmetra-login-isolated.stderr"
          test ! -s "$RUNNER_TEMP/synmetra-login-isolated.stdout"

          env -i PATH=/nonexistent XDG_CONFIG_HOME="$config_root" \
            target/debug/synmetra auth logout \
            > "$RUNNER_TEMP/synmetra-logout-isolated.txt"
          grep -Fq 'Synmetra local credentials cleared' \
            "$RUNNER_TEMP/synmetra-logout-isolated.txt"

          if XDG_CONFIG_HOME="$config_root" target/debug/synmetra auth login --headless \
            > "$RUNNER_TEMP/synmetra-auth-bad.stdout" \
            2> "$RUNNER_TEMP/synmetra-auth-bad.stderr"; then
            echo 'Login without OAuth client unexpectedly succeeded' >&2
            exit 1
          fi
          grep -Fq 'OAuth login requires --client-id-file' "$RUNNER_TEMP/synmetra-auth-bad.stderr"
          test ! -s "$RUNNER_TEMP/synmetra-auth-bad.stdout"
          XDG_CONFIG_HOME="$config_root" target/debug/synmetra auth logout \
            > "$RUNNER_TEMP/synmetra-logout.txt"
          grep -Fq 'Revoke access in your Google account' "$RUNNER_TEMP/synmetra-logout.txt"

      - name: Verify isolated Cargo source install and native CLI lifecycle
        shell: bash
        run: |
          root="$RUNNER_TEMP/synmetra-installed"
          mkdir -p "$root"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            cargo +1.99.1 install --path . --locked --debug --bin synmetra --root "$root"
          test -x "$root/bin/synmetra"
          test ! -e "$root/bin/synmetra-progress"
          config_root="$(mktemp -d "$RUNNER_TEMP/synmetra-install-smoke.XXXXXX")"
          trap 'rm -rf "$config_root"' EXIT
          env -i PATH=/nonexistent XDG_CONFIG_HOME="$config_root" \
            "$root/bin/synmetra" auth doctor > "$RUNNER_TEMP/synmetra-installed-doctor.txt"
          grep -Fq 'To configure native OAuth:' "$RUNNER_TEMP/synmetra-installed-doctor.txt"
          if grep -Eiq 'refresh_token|client_secret|access_token": "' \
            "$RUNNER_TEMP/synmetra-installed-doctor.txt"; then
            echo 'Sensitive credential value in native install smoke' >&2
            exit 1
          fi
          cargo +1.99.1 uninstall --root "$root" synmetra
          test ! -e "$root/bin/synmetra"

      - name: Reject unsupported public MCP bind overrides before network startup
        shell: bash
        run: |
          if target/debug/synmetra serve --http-loopback --host 0.0.0.0 \
            > "$RUNNER_TEMP/synmetra-nonloopback.stdout" \
            2> "$RUNNER_TEMP/synmetra-nonloopback.stderr"; then
            echo "Unsupported public bind override unexpectedly succeeded" >&2
            exit 1
          fi
          grep -Fq 'Usage: synmetra serve' "$RUNNER_TEMP/synmetra-nonloopback.stderr"
          test ! -s "$RUNNER_TEMP/synmetra-nonloopback.stdout"

      - name: Verify progress ledger and pinned contracts
        run: cargo run --locked --bin synmetra-progress
      - name: Verify README and roadmap bars regenerate reproducibly
        run: |
          cargo run --locked --bin synmetra-progress -- --write-bars
          git diff --exit-code -- README.md docs/ROADMAP.md

  duckdb:
    concurrency:
      group: synmetra-duckdb-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install pinned Rust 1.99.1 with rustfmt and Clippy
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustc --version | grep -F 'rustc 1.99.1'
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Determine whether the native feature changed
        id: native
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(src/(main|scratchpad)\.rs$|Cargo\.toml$|Cargo\.lock$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Test bounded DuckDB scratchpad
        if: steps.native.outputs.changed == 'true' || startsWith(github.ref, 'refs/tags/v')
        env:
          SYNMETRA_CAPTURE_INPUT_SCHEMAS: "1"
        run: cargo test --all-targets --locked --features scratchpad -- --nocapture
      - name: Release-gate strict Clippy with DuckDB
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo clippy --all-targets --locked --features scratchpad -- -D warnings
