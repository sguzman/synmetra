name: Rust native MCP and evidence integrity

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    concurrency:
      group: synmetra-core-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Capture canonical Google source formatting
        run: |
          cargo fmt --all
          echo SYNMETRA_FILE_BEGIN:src/google.rs
          base64 -w0 src/google.rs
          echo
          echo SYNMETRA_FILE_END:src/google.rs
      - name: Run default Rust MCP tests
        run: cargo test --all-targets --locked
      - name: Strict Clippy on default features
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Verify progress ledger and pinned contracts
        run: cargo run --locked --bin synmetra-progress

  duckdb:
    concurrency:
      group: synmetra-${{ github.workflow }}-${{ github.ref }}-code
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Determine whether the native feature changed
        id: native
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(src/(main|scratchpad)\.rs$|Cargo\.toml$|Cargo\.lock$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Test bounded DuckDB scratchpad
        if: steps.native.outputs.changed == 'true' || startsWith(github.ref, 'refs/tags/v')
        run: cargo test --all-targets --locked --features scratchpad
      - name: Release-gate strict Clippy with DuckDB
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo clippy --all-targets --locked --features scratchpad -- -D warnings
