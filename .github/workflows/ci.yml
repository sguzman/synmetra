name: Rust native MCP and evidence integrity

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: synmetra-${{ github.workflow }}-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, 'docs:') && 'docs' || 'code' }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Capture canonical Rust source formatting and resolved dependency lock
        run: |
          cargo generate-lockfile
          cargo fmt --all
          for file in src/main.rs src/google.rs src/scratchpad.rs src/auth.rs src/http.rs src/bin/synmetra-progress.rs Cargo.lock; do
            echo "SYNMETRA_FILE_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "SYNMETRA_FILE_END:$file"
          done
      - name: Run default Rust MCP tests
        run: cargo test --all-targets --locked
      - name: Strict Clippy on default features
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Verify progress ledger and pinned contracts
        run: cargo run --locked --bin synmetra-progress

  duckdb:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Determine whether the native feature changed
        id: native
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(src/|Cargo\.toml$|Cargo\.lock$|\.github/workflows/ci\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Regenerate dependencies for one-time lockfile repair
        if: steps.native.outputs.changed == 'true' || startsWith(github.ref, 'refs/tags/v')
        run: cargo generate-lockfile
      - name: Test bounded DuckDB scratchpad
        if: steps.native.outputs.changed == 'true' || startsWith(github.ref, 'refs/tags/v')
        run: cargo test --all-targets --locked --features scratchpad
      - name: Release-gate strict Clippy with DuckDB
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo clippy --all-targets --locked --features scratchpad -- -D warnings
