name: Rust foundation and progress integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust project
        run: cargo test --all-targets --locked
      - name: Canonical annotation tool formatting
        run: |
          cargo fmt --all
          echo SYNMETRA_FILE_BEGIN:src/main.rs
          base64 -w0 src/main.rs
          echo
          echo SYNMETRA_FILE_END:src/main.rs
      - name: Check Clippy strictly
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Verify task evidence and pinned MCP union
        run: cargo run --locked --bin synmetra-progress
