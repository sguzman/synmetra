[package]
name = "synmetra"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Native Rust Google Analytics MCP server"
repository = "https://github.com/sguzman/synmetra"
publish = false

[[bin]]
name = "synmetra"
path = "src/main.rs"

[[bin]]
name = "synmetra-progress"
path = "src/bin/synmetra-progress.rs"

[features]
default = []
scratchpad = ["dep:duckdb"]

[dependencies]
duckdb = { version = "1.4.2", default-features = false, features = ["bundled"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
axum = "0.8"
subtle = "2"
base64 = "0.22"
futures-util = "0.3"
rand = "0.8"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }

[dev-dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw"] }
