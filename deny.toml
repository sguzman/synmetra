# Cargo dependency audits for Synmetra (T013/T177).
# Run: cargo deny --all-features check bans licenses sources
# Advisory database checks run independently in CI so a new advisory
# generates a visible finding, not a silent bypass or speculative claim.

[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[advisories]
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
# This allowlist applies to Rust package license choices, NOT blanket
# permission to use a native library with incompatible redistribution terms.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
  "MPL-2.0",
  "BSL-1.0",
  "OpenSSL",
]
